driver:
  name: docker

platforms:
  - name: debian-trixie
    image: debian:trixie-20261104
    dockerfile: Dockerfile.j2
    pre_build_image: false
    # systemd runs as PID 1 so sshd runs and reloads as a service, as on a real machine.
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  inventory:
    host_vars:
      debian-trixie:
        ssh_hardening_login_user: deploy

verifier:
  name: ansible
