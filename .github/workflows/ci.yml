name: CI

on:
  push:
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-24.04
    # Release commits are made by the versioning job and need no checks.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - run: npm ci

      - name: Commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}

      - name: Markdown
        run: npx markdownlint-cli2

      - name: Spelling
        run: npx cspell lint "**"

      - name: Secrets
        run: npx secretlint "**/*"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Ansible
        run: |
          pip install -r requirements-lint.txt
          ansible-lint

  testing:
    needs: linting
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: molecule test

  versioning:
    needs: testing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Pushing the release commit and tag needs a token that can bypass branch protection on main.
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - run: npm ci

      - name: Bump the version, update the changelog and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            npx commit-and-tag-version --first-release
          elif git log "$(git describe --tags --abbrev=0)..HEAD" --format="%s%n%b" | grep -qE "^(feat|fix)(\(.+\))?!?:|BREAKING CHANGE"; then
            npx commit-and-tag-version
          else
            echo "Nothing to release."
            exit 0
          fi
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push and publish the release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git push --follow-tags origin HEAD:main
          gh release create "${{ steps.release.outputs.version }}" --title "${{ steps.release.outputs.version }}" --generate-notes
