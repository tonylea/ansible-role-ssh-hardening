name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The steps, variables and playbook needed to see the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you're using, for example v1.0.0.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Ansible version, and the target's OS and version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove anything secret first.
      render: text
